plugins {
    id 'fabric-loom' version '1.16.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "minecraftai" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet.set(true)
        modId.set('minecraftai-gametest')
        enableGameTests.set(true)
        enableClientGameTests.set(false)
    }
}

// Interactive/dedicated verification server. It loads the isolated gametest source set but does
// not enable automatic GameTest execution, so command-driven harnesses stay out of the production jar.
def harnessRunDir = providers.gradleProperty('minecraftaiHarnessRunDir').orElse('build/run/harness').get()
def harnessRunInput = new File(harnessRunDir)
def harnessRunFile = file(harnessRunDir).canonicalFile
if (harnessRunInput.isAbsolute()
        || !harnessRunFile.toPath().startsWith(project.projectDir.canonicalFile.toPath())
        || harnessRunFile == project.projectDir.canonicalFile) {
    throw new GradleException('minecraftaiHarnessRunDir must be a project-relative child directory')
}
loom.runs {
    harnessServer {
        server()
        configName = 'Minecraft-AI Harness Server'
        source sourceSets.gametest
        runDir harnessRunDir
    }
}

def prepareHarnessRun = tasks.register('prepareHarnessRun') {
    group = 'verification'
    description = 'Creates missing files for an isolated command-driven harness server.'
    outputs.upToDateWhen { false }

    doLast {
        def dir = harnessRunFile
        dir.mkdirs()
        def eula = new File(dir, 'eula.txt')
        if (!eula.exists()) {
            eula.setText('eula=true\n', 'UTF-8')
        }
        def properties = new File(dir, 'server.properties')
        if (!properties.exists()) {
            def seed = System.getenv('MINECRAFTAI_TEST_SEED') ?: '20260610'
            def port = System.getenv('MINECRAFTAI_TEST_PORT') ?: '25565'
            properties.setText(
                    "online-mode=false\nlevel-name=world\nlevel-seed=${seed}\nserver-port=${port}\n", 'UTF-8')
        }
    }
}

tasks.named('runHarnessServer') {
    dependsOn prepareHarnessRun
}

loom.runs.named('gameTest') {
    property 'fabric-api.gametest.report-file',
            file('build/test-results/gametest/TEST-minecraftai-gametest.xml').absolutePath
}

// Rewrites a mod jar into dest with the "fabric-gametest" entrypoints removed from its fabric.mod.json (everything else verbatim).
def copyWithoutGameTestEntrypoint(File src, File dest) {
    def zin = new java.util.zip.ZipInputStream(new FileInputStream(src))
    def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(dest))
    try {
        for (def e = zin.nextEntry; e != null; e = zin.nextEntry) {
            byte[] bytes = zin.readAllBytes()
            if (e.name == 'fabric.mod.json') {
                def json = new groovy.json.JsonSlurper().parseText(new String(bytes, 'UTF-8'))
                json.entrypoints.remove('fabric-gametest')
                bytes = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)).getBytes('UTF-8')
            }
            def out = new java.util.zip.ZipEntry(e.name)
            out.time = e.time
            zout.putNextEntry(out)
            zout.write(bytes)
            zout.closeEntry()
        }
    } finally {
        zin.close()
        zout.close()
    }
}

def prepareGameTestRun = tasks.register('prepareGameTestRun') {
    group = 'verification'
    description = 'Creates a clean, deterministic headless GameTest run directory.'
    outputs.upToDateWhen { false }

    doLast {
        def runDir = file('build/run/gameTest')
        delete runDir
        runDir.mkdirs()
        new File(runDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(runDir, 'server.properties').setText(
                'online-mode=false\nlevel-name=world\nlevel-seed=0\n', 'UTF-8')

        // Optional pack-compat check: -PgametestExtraMods=<dir> copies that directory's *.jar into the run dir's mods/
        // (Fabric Loader loads them in the dev run and remaps intermediary jars). Default off, so normal runs are unchanged.
        // See docs/TESTING_AND_EVIDENCE.md.
        def extraModsDir = providers.gradleProperty('gametestExtraMods').orNull
        if (extraModsDir) {
            def extraDir = new File(extraModsDir)
            if (!extraDir.isDirectory()) {
                throw new GradleException("gametestExtraMods is not a directory: ${extraModsDir}")
            }
            // Never load: our own mod (a deployed, older Minecraft-AI jar would clash with the dev build under test) and
            // fabric-api (the dev run already has it; a second build of it would replace the mapped one).
            // Extend with -PgametestExtraModsSkip=id1,id2 for a mod that cannot start in the headless server environment.
            def skipIds = ['minecraftai', 'minecraftai-gametest', 'fabric-api'] as Set
            def extraSkip = providers.gradleProperty('gametestExtraModsSkip').orNull
            if (extraSkip) {
                extraSkip.split(',').each { if (it.trim()) skipIds << it.trim() }
            }
            def modsDir = new File(runDir, 'mods')
            modsDir.mkdirs()
            def copied = []
            def skipped = []
            (extraDir.listFiles({ f -> f.isFile() && f.name.toLowerCase().endsWith('.jar') } as FileFilter) ?: new File[0])
                    .sort { it.name }.each { File jar ->
                String modId = null
                boolean hasGameTestEntrypoint = false
                boolean clientOnly = false
                def zip = new java.util.zip.ZipFile(jar)
                try {
                    def entry = zip.getEntry('fabric.mod.json')
                    if (entry != null) {
                        def modJson = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry), 'UTF-8')
                        modId = modJson.id
                        clientOnly = modJson.environment == 'client'
                        hasGameTestEntrypoint = modJson.entrypoints instanceof Map && modJson.entrypoints.containsKey('fabric-gametest')
                    }
                } finally {
                    zip.close()
                }
                if (modId == null) {
                    skipped << "${jar.name} (no fabric.mod.json)"
                } else if (clientOnly) {
                    // the dedicated server never loads it, but the runtime remapper would still process it: skip the work and the risk
                    skipped << "${jar.name} (client-only: ${modId})"
                } else if (skipIds.contains(modId)) {
                    skipped << "${jar.name} (skip list: ${modId})"
                } else {
                    if (hasGameTestEntrypoint) {
                        // A pack mod's own "fabric-gametest" entrypoint (its dev-time tests, whose classes are not in the
                        // release jar) would be run by Fabric GameTest and crash the server: copy the jar without it.
                        copyWithoutGameTestEntrypoint(jar, new File(modsDir, jar.name))
                        copied << "${jar.name} (${modId}; fabric-gametest entrypoint stripped)"
                    } else {
                        java.nio.file.Files.copy(jar.toPath(), new File(modsDir, jar.name).toPath())
                        copied << "${jar.name} (${modId})"
                    }
                }
            }
            logger.lifecycle("gametestExtraMods: copied ${copied.size()} jar(s) from ${extraDir}:")
            copied.each { logger.lifecycle("  + ${it}") }
            skipped.each { logger.lifecycle("  - skipped ${it}") }
            // The pack's own config files decide how its mods behave on a server (Physics Mod, for one, collapses connected
            // blocks unless "collapse" is off in physics_server_config.json), so a run without them tests a pack nobody plays.
            // -PgametestExtraModsConfig=<config dir> copies that directory into the run dir's config/ (contents are never logged;
            // only names). Our own mod's files (they hold the LLM key), *.bak files and VeinMiner's (set below) are left out.
            def extraConfig = providers.gradleProperty('gametestExtraModsConfig').orNull
            if (extraConfig) {
                def cfgSrc = new File(extraConfig)
                if (!cfgSrc.isDirectory()) {
                    throw new GradleException("gametestExtraModsConfig is not a directory: ${extraConfig}")
                }
                def cfgDest = new File(runDir, 'config')
                cfgDest.mkdirs()
                def cfgCopied = []
                cfgSrc.listFiles().sort { it.name }.each { File entry ->
                    def lower = entry.name.toLowerCase()
                    if (lower.startsWith('minecraftai') || lower.startsWith('aibot') || lower.endsWith('.bak') || lower == 'veinminer') {
                        return
                    }
                    if (entry.isDirectory()) {
                        entry.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                            def target = new File(new File(cfgDest, entry.name), entry.toPath().relativize(f.toPath()).toString())
                            target.parentFile.mkdirs()
                            java.nio.file.Files.copy(f.toPath(), target.toPath())
                        }
                    } else {
                        java.nio.file.Files.copy(entry.toPath(), new File(cfgDest, entry.name).toPath())
                    }
                    cfgCopied << entry.name
                }
                logger.lifecycle("gametestExtraModsConfig: copied ${cfgCopied.size()} config entries: ${cfgCopied.join(', ')}")
            }
            // VeinMiner: the run must exercise the permission hook, so turn permissionRestricted on in the RUN DIR's config
            // (never in the directory the jars came from).
            if (copied.any { it.contains('(veinminer') }) {
                def veinCfg = new File(runDir, 'config/Veinminer')
                veinCfg.mkdirs()
                // The complete default settings with permissionRestricted flipped: a partial file was not honoured by VeinMiner.
                new File(veinCfg, 'settings.json').setText('''{
    "cooldown": 20,
    "mustSneak": false,
    "delay": 0,
    "maxChain": 100,
    "needCorrectTool": true,
    "searchRadius": 1,
    "permissionRestricted": true,
    "mergeItemDrops": false,
    "autoUpdate": false,
    "decreaseDurability": true,
    "hungerPerBlock": 0.0,
    "miningSpeedModifier": 0.0,
    "debug": false,
    "client": {
        "allow": true,
        "require": false,
        "translucentBlockHighlight": true,
        "allBlocks": false,
        "overrides": {
            "cooldown": null,
            "mustSneak": null,
            "delay": null,
            "maxChain": null,
            "needCorrectTool": null,
            "searchRadius": null,
            "permissionRestricted": null,
            "decreaseDurability": null,
            "hungerPerBlock": null,
            "miningSpeedModifier": null
        }
    }
}
''', 'UTF-8')
                // VeinMiner ignores autoUpdate and downloads the newest Modrinth file into config/Veinminer/update/ on every launch:
                // occupy that path with a plain file (as the real profile does) so the write fails harmlessly.
                new File(veinCfg, 'update').setText('', 'UTF-8')
                logger.lifecycle('gametestExtraMods: wrote config/Veinminer/settings.json with permissionRestricted=true in the run dir')
            }
        }
    }
}

tasks.named('runGameTest') {
    dependsOn prepareGameTestRun
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Optional integration: VeinMiner ships this API jar-in-jar; we only hook it when it is loaded.
    // modLocalRuntime puts it on dev runs (GameTests) without adding it to the published jar.
    modCompileOnly "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"
    modLocalRuntime "me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Vendored Baritone + our replayable patch series, compiled as the `baritone` source set (see tools/baritone/README.md).
apply from: 'tools/baritone/baritone.gradle'

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
