plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Nothing extra: PvP BOT is deliberately NOT a compile-time dependency.
    // The addon talks to it only through PvpBotAdapter (reflection + public commands).
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pure-logic unit tests (samplers, config, persistence, deterministic hashing, setting catalog).
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------------------------------------------
// Real-server GameTest harness (src/gametest). The tests need PvP BOT and HeroBot as RUNTIME mods, so they can
// only run when a directory holding their release jars exists: -PupstreamModsDir=<dir> (default
// C:\mcw\_tools\deploycheck\mods). The jars are copied into the run directory's mods/ and remapped by Fabric Loader
// like in a real profile; they are never a compile-time input, and nothing here changes the published jar. When
// the directory or either jar is absent, runGameTest is skipped with a message, so a plain build and the unit
// tests are unaffected. Start it through C:\mcw\_tools\gt_wrapper.sh (it serialises servers machine-wide).
// ---------------------------------------------------------------------------------------------------------------
fabricApi {
    configureTests {
        createSourceSet.set(true)
        modId.set('pvpbot-inhabitants-gametest')
        enableGameTests.set(true)
        enableClientGameTests.set(false)
    }
}

def upstreamModsDir = new File(providers.gradleProperty('upstreamModsDir').orElse('C:\\mcw\\_tools\\deploycheck\\mods').get())
def upstreamJars = { String prefix ->
    upstreamModsDir.isDirectory()
            ? (upstreamModsDir.listFiles({ f -> f.isFile() && f.name.toLowerCase().startsWith(prefix) && f.name.toLowerCase().endsWith('.jar') } as FileFilter) ?: new File[0]).sort { it.name }
            : new File[0]
}
def upstreamAvailable = upstreamJars('pvp_bot').length > 0 && upstreamJars('herobot').length > 0

loom.runs.named('gameTest') {
    property 'fabric-api.gametest.report-file',
            file('build/test-results/gametest/TEST-pvpbot-inhabitants-gametest.xml').absolutePath
}

def prepareGameTestRun = tasks.register('prepareGameTestRun') {
    group = 'verification'
    description = 'Creates a clean headless GameTest run directory with PvP BOT and HeroBot as runtime mods.'
    outputs.upToDateWhen { false }
    onlyIf { upstreamAvailable }

    doLast {
        def runDir = file('build/run/gameTest')
        delete runDir
        runDir.mkdirs()
        new File(runDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(runDir, 'server.properties').setText(
                'online-mode=false\nlevel-name=world\nlevel-seed=0\n', 'UTF-8')
        def modsDir = new File(runDir, 'mods')
        modsDir.mkdirs()
        (upstreamJars('pvp_bot') + upstreamJars('herobot')).each { File jar ->
            java.nio.file.Files.copy(jar.toPath(), new File(modsDir, jar.name).toPath())
            logger.lifecycle("upstream mod: ${jar.name}")
        }

        // PvP BOT uploads bot names and counts over plain HTTP unless told not to: never from a test run.
        def pvpbotConfig = new File(runDir, 'config/pvpbot')
        pvpbotConfig.mkdirs()
        new File(pvpbotConfig, 'stats_config.json').setText('{\n  "send_anonymous_statistics": false\n}\n', 'UTF-8')
        // PvP BOT's per-world settings of the GameTest world ("Test Level"): the values the real profile runs with
        // (short ranges, auto target on, players targeted), EXCEPT autoEquipWeapon, which stays at PvP BOT's own default
        // (true) on purpose: this addon's pvpbotSettings policy is what has to turn it off (it is what cancels every
        // bow and crossbow draw), and the harness proves that it does.
        // attackInvincible is on only because GameTest mock players report isCreative() = true, which PvP BOT never targets.
        def worldSettings = new File(pvpbotConfig, 'worlds/Test Level')
        worldSettings.mkdirs()
        new File(worldSettings, 'settings.json').setText('''{
  "autoEquipWeapon": true,
  "checkInterval": 20,
  "autoTargetEnabled": true,
  "targetPlayers": true,
  "attackInvincible": true,
  "maxTargetDistance": 10.0,
  "meleeRange": 3.5,
  "rangedMinRange": 6.0,
  "rangedOptimalRange": 8.0,
  "rangedMaxRange": 10.0,
  "bowMinDrawTime": 40,
  "totemPriority": true,
  "autoShieldEnabled": true,
  "shieldHoldTicks": 60,
  "retreatEnabled": true,
  "factionsEnabled": true
}
''', 'UTF-8')
        // -PharnessFixesOff=true: the addon's managed PvP BOT settings (pvpbotSettings) switched off, i.e. what a
        // profile ran with before them. The same tests then show the failures the fixes are for.
        def fixesOff = providers.gradleProperty('harnessFixesOff').orNull == 'true'
        def fixesConfig = fixesOff ? ',\n  "pvpbotSettings": null' : ''
        if (fixesOff) {
            logger.lifecycle('harnessFixesOff: pvpbotSettings is switched off in this run')
        }
        // The addon's own config: natural structure population is off (nothing matches "include"), so the only
        // inhabitants are the ones a test asks the engine for; no waiting periods, no throttles, no random loadouts.
        new File(runDir, 'config').mkdirs()
        new File(runDir, 'config/pvpbot_inhabitants.json').setText('''{
  "include": ["gametest:none"],
  "processing": { "restoreSettleTicks": 0, "initialDelayTicks": 0, "spawnIntervalTicks": 0, "maxLiveBots": 8 },
  "profiles": { "randomize": false, "behaviorVariation": false, "attributeVariation": false },
  "tpsThrottle": { "enabled": false },
  "dormancy": { "enabled": false }''' + fixesConfig + '\n}\n', 'UTF-8')
    }
}

tasks.named('runGameTest') {
    dependsOn prepareGameTestRun
    onlyIf {
        if (!upstreamAvailable) {
            logger.lifecycle("runGameTest skipped: no PvP BOT / HeroBot jars in ${upstreamModsDir} (pass -PupstreamModsDir=<dir>)")
        }
        upstreamAvailable
    }
}

// The GameTests start a real server, which must only ever run through the machine-wide lock (C:\mcw\_tools\gt_wrapper.sh)
// or an explicit `gradlew runGameTest`: neither `build` nor `check` may depend on it (Fabric API's test configuration wires
// runGameTest into check by default).
afterEvaluate {
    tasks.named('check') { checkTask ->
        def others = checkTask.dependsOn.findAll { dep ->
            !((dep instanceof TaskProvider && dep.name == 'runGameTest') || (dep instanceof Task && dep.name == 'runGameTest')
                    || dep == 'runGameTest')
        }
        checkTask.setDependsOn(others)
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName.get()

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
