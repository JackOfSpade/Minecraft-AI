name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check source-set and workflow invariants
        run: bash scripts/ci_static_check.sh

      - name: Run unit tests, headless GameTests and production build
        run: ./gradlew --no-daemon --console=plain --stacktrace clean test runGameTest build

      - name: Collect release jars
        id: artifacts
        run: |
          set -euo pipefail
          mod_jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          [[ -n "$mod_jar" ]] || { echo 'no production jar found in build/libs' >&2; exit 1; }
          sources_jar="$(find build/libs -maxdepth 1 -type f -name '*-sources.jar' -print -quit)"
          {
            echo "mod_jar=$mod_jar"
            echo "sources_jar=$sources_jar"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=("${{ steps.artifacts.outputs.mod_jar }}")
          if [[ -n "${{ steps.artifacts.outputs.sources_jar }}" ]]; then
            assets+=("${{ steps.artifacts.outputs.sources_jar }}")
          fi
          gh release create "${{ github.ref_name }}" \
            "${assets[@]}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
