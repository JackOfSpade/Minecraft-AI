name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check source-set and workflow invariants
        run: bash scripts/ci_static_check.sh

      - name: Run unit tests, headless GameTests and production build
        run: ./gradlew --no-daemon --console=plain --stacktrace clean test runGameTest build

      - name: Run PvP BOT wrapper unit tests, GameTest source compilation, and production build
        working-directory: Minecraft-Spawn-Bots-Wrapper
        run: ./gradlew --no-daemon --console=plain --stacktrace clean test compileGametestJava build

      - name: Inspect release artifacts
        run: CI_STATIC_CHECK_ARTIFACTS=all bash scripts/ci_static_check.sh

      - name: Collect release jars
        id: artifacts
        run: |
          set -euo pipefail
          release_jar() {
            local directory="$1" prefix="$2"
            local -a matches=()
            mapfile -t matches < <(find "$directory" -maxdepth 1 -type f -name "${prefix}-*.jar" \
              ! -name '*-sources.jar' ! -name '*-dev.jar' -print)
            [[ "${#matches[@]}" -eq 1 ]] \
              || { echo "expected exactly one production ${prefix} jar in ${directory}" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          optional_sources_jar() {
            local directory="$1" prefix="$2"
            local -a matches=()
            mapfile -t matches < <(find "$directory" -maxdepth 1 -type f -name "${prefix}-*-sources.jar" -print)
            [[ "${#matches[@]}" -le 1 ]] \
              || { echo "expected at most one ${prefix} sources jar in ${directory}" >&2; exit 1; }
            if [[ "${#matches[@]}" -eq 1 ]]; then
              printf '%s\n' "${matches[0]}"
            fi
          }
          mod_jar="$(release_jar build/libs Minecraft-AI)"
          sources_jar="$(optional_sources_jar build/libs Minecraft-AI)"
          wrapper_jar="$(release_jar Minecraft-Spawn-Bots-Wrapper/build/libs pvpbot-inhabitants)"
          wrapper_sources_jar="$(optional_sources_jar Minecraft-Spawn-Bots-Wrapper/build/libs pvpbot-inhabitants)"
          {
            echo "mod_jar=$mod_jar"
            echo "sources_jar=$sources_jar"
            echo "wrapper_jar=$wrapper_jar"
            echo "wrapper_sources_jar=$wrapper_sources_jar"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=("${{ steps.artifacts.outputs.mod_jar }}" "${{ steps.artifacts.outputs.wrapper_jar }}")
          if [[ -n "${{ steps.artifacts.outputs.sources_jar }}" ]]; then
            assets+=("${{ steps.artifacts.outputs.sources_jar }}")
          fi
          if [[ -n "${{ steps.artifacts.outputs.wrapper_sources_jar }}" ]]; then
            assets+=("${{ steps.artifacts.outputs.wrapper_sources_jar }}")
          fi
          gh release create "${{ github.ref_name }}" \
            "${assets[@]}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
