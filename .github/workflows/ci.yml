name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, GameTest, production jar and runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check source-set and workflow invariants
        run: bash scripts/ci_static_check.sh

      - name: Run evidence validator adversarial self-tests
        run: bash scripts/evidence_validate.sh --self-test

      - name: Run unit tests, headless GameTests and production build
        run: ./gradlew --no-daemon --console=plain --stacktrace clean test runGameTest build

      - name: Inspect production artifacts
        run: CI_STATIC_CHECK_ARTIFACTS=main bash scripts/ci_static_check.sh

      - name: Retain tested production JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Minecraft-AI-tested-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

      - name: Verify persistence across two JVM processes
        run: bash scripts/persistence_restart_test.sh

      - name: Run isolated strict-survival runtime and Mining First contracts
        run: >-
          bash scripts/evidence_run.sh
          --scenario capability_profile+runtime_control_suite+mining_contract_suite
          --seed 20260610
          --timeout 240
          --startup-timeout 480
          --profile strict_survival

      - name: Validate sealed evidence
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' bundle; do
            found=1
            bash scripts/evidence_validate.sh --require-verified "$bundle"
          done < <(find artifacts/evidence -mindepth 1 -maxdepth 1 -type d -print0)
          [[ "$found" == 1 ]]

      - name: Upload CI diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/evidence/**
            build/reports/tests/**
            build/test-results/**
            build/run/gameTest/logs/**
            build/run/gameTest/crash-reports/**
            build/persistence-restart/**
            build/run/restart-*/logs/**
            build/run/restart-*/crash-reports/**
            build/libs/**

  wrapper:
    name: PvP BOT wrapper unit build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run wrapper unit tests, GameTest source compilation, and production build
        working-directory: Minecraft-Spawn-Bots-Wrapper
        run: ./gradlew --no-daemon --console=plain --stacktrace clean test compileGametestJava build

      - name: Inspect wrapper production artifacts
        run: CI_STATIC_CHECK_ARTIFACTS=wrapper bash scripts/ci_static_check.sh

      - name: Upload wrapper diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wrapper-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            Minecraft-Spawn-Bots-Wrapper/build/reports/**
            Minecraft-Spawn-Bots-Wrapper/build/test-results/**
            Minecraft-Spawn-Bots-Wrapper/build/libs/**

  required:
    name: CI required
    if: ${{ always() }}
    needs: ["verify", "wrapper", "merge-policy"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              sys.exit("Unsuccessful prerequisites: " + ", ".join(failed))
          PY
  merge-policy:
    name: Validate merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github/tests -p 'test_merge_validated_pr.py'
